name: CI

# PR 上的构建校验。这里刻意不打 sha、不上传 artifact —— PR 从不部署，
# 那两步的产出没有任何消费者，只是白占 CI 时间与 artifact 存储。
# 部署流程在 deploy.yml，它只在 main 上触发。
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # package.json 的 engines 写的是 >=14 <18，那是上游 inert 留下的过时声明：
      # 它描述的是 Windows 上缺 VS Build Tools 时 deasync 装不上的情况（见 .NODE_ENV_README.md），
      # 不是跨平台约束。Linux runner 自带编译工具链，Node 22 下全部检查通过。
      # engines 字段的清理属于 issue #1（迁移到 Vite）的范围。
      #
      # 这份配置与 deploy.yml 的 build job 必须保持一致，改动其一时记得同步另一个。
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # npm run test == parcel build + tests/texture-assets.test.js，
      # 一步同时覆盖构建与产物贴图校验。
      - name: Build and validate
        run: npm run test

      - name: Typecheck
        run: npx tsc --noEmit

      # deploy.yml 不再在 PR 上触发，改动它将得不到任何验证。actionlint 补上这一层，
      # 而且查得比「YAML 能否解析」多：无效的 needs / if 表达式、不存在的 context、
      # 以及对内嵌 run 块跑 shellcheck。
      #
      # 固定版本并校验 SHA256。官方文档推荐 curl | bash，那等于每次 PR 都执行一段
      # 来自网络的任意代码，本仓库不这么引外部工具。
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          TARBALL="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$TARBALL" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${TARBALL}"
          echo "${ACTIONLINT_SHA256}  ${TARBALL}" | sha256sum -c -
          tar -xzf "$TARBALL" actionlint
          ./actionlint
          rm -f "$TARBALL" actionlint
