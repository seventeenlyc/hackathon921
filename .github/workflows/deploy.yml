name: Deploy

# 构建在 CI 完成，服务器只接收产物 —— docs/PRODUCT_CONCEPT.md §14：
# 目标机是内存余量有限的共享生产服务器，构建峰值会挤压既有业务。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOMAIN: prompt-defense.crowntime.cn
  APP_DIR: /srv/apps/prompt-defense.crowntime.cn
  KEEP_RELEASES: 5

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # package.json 的 engines 写的是 >=14 <18，那是上游 inert 留下的过时声明：
      # 它描述的是 Windows 上缺 VS Build Tools 时 deasync 装不上的情况（见 .NODE_ENV_README.md），
      # 不是跨平台约束。Linux runner 自带编译工具链，Node 22 下 npm ci / build / test 均通过。
      # engines 字段的清理属于 issue #1（迁移到 Vite）的范围，不在本分支处理。
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # npm run test == parcel build + tests/texture-assets.test.js，
      # 一步同时覆盖构建与产物贴图校验。
      - name: Build and validate
        run: npm run test

      - name: Typecheck
        run: npx tsc --noEmit

      # 线上可用 curl /version.txt 确认当前跑的是哪个 commit。
      - name: Stamp build with commit sha
        run: echo "$GITHUB_SHA" > dist/version.txt

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 固定 host key，不使用 StrictHostKeyChecking=no：
          # 部署流量走公网，接受任意主机密钥等于放弃中间人防护。
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          SSH_CMD="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes"
          TARGET="$DEPLOY_USER@$DEPLOY_HOST"

          # 产物里 95% 是贴图（3.4MB / 3.5MB），而贴图几乎从不变化。每个版本落在一个
          # 全新的空目录，rsync 没有可比对的基准，默认会把整个 3.5MB 每次重传一遍——
          # 跨境链路约 11KB/s，这一步实测要 313 秒。
          #
          # --link-dest 让 rsync 拿上一个版本当基准，只把真正变了的文件送过境。
          # --checksum 是必需的搭档：CI 每次都是全新构建，文件 mtime 全是新的，
          # rsync 默认的 size+mtime 快速比对会判定所有贴图都变了，优化直接失效。
          # 实测（同内容、mtime 差两天）：不加 --checksum 传 300,009 字节，加了传 9 字节。
          #
          # 注意 rsync 此时不会做硬链接——-a 要保留新的 mtime，而硬链接共享 inode 也就
          # 共享 mtime，二者不可兼得。它改为在服务器本地从上一版复制。这正是我们要的：
          # 数据不过境，本地复制在服务器上是白菜价。
          PREV="$($SSH_CMD "$TARGET" "readlink '$APP_DIR/current' 2>/dev/null || true")"
          LINK_DEST=""
          if [ -n "$PREV" ] && [ "$PREV" != "releases/$GITHUB_SHA" ]; then
            LINK_DEST="--link-dest=$APP_DIR/$PREV"
            echo "增量基准: $PREV"
          else
            echo "无可用基准，本次全量传输"
          fi

          $SSH_CMD "$TARGET" "mkdir -p '$APP_DIR/releases/$GITHUB_SHA'"

          # 先落盘再 grep：直接管道给 grep 的话，grep 无匹配时返回 1，
          # 配合 pipefail 会把一次成功的传输报成失败。
          rsync -az --checksum --delete --chmod=D755,F644 $LINK_DEST \
            -e "$SSH_CMD" --stats \
            dist/ "$TARGET:$APP_DIR/releases/$GITHUB_SHA/" > rsync-stats.log
          grep -E "Number of regular files transferred|Total transferred file size" rsync-stats.log || true

      - name: Activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_DIR='$APP_DIR' SHA='$GITHUB_SHA' KEEP='$KEEP_RELEASES' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          [ -d "releases/$SHA" ] || { echo "release releases/$SHA 不存在" >&2; exit 1; }
          [ -f "releases/$SHA/index.html" ] || { echo "产物缺少 index.html" >&2; exit 1; }

          # 切换之前先记下上一版，它是天然的回滚目标，下面的清理要保护它。
          previous="$(readlink current 2>/dev/null || true)"

          # mv -T 是原子 rename，切换过程中不存在 current 不指向任何版本的瞬间。
          # nginx 每次请求才解析 root 下的符号链接，所以这里不需要 reload nginx，
          # 部署用户也因此不需要任何 sudo 权限。
          ln -sfn "releases/$SHA" current.tmp
          mv -Tf current.tmp current

          # 只保留最近 KEEP 个版本，但本次版本与上一版永不清理。
          # 上一版必须单独保护：人工回滚到某个旧版本后，它的 mtime 已经很旧，
          # 会排在 KEEP 窗口之外，照常清理就会把刚刚回滚上去、正要再回滚的那一版删掉。
          stale="$(ls -1dt releases/*/ | tail -n "+$((KEEP + 1))" || true)"
          while IFS= read -r rel; do
            [ -n "$rel" ] || continue
            rel="${rel%/}"
            [ "$rel" = "releases/$SHA" ] && continue
            [ "$rel" = "$previous" ] && continue
            rm -rf -- "$rel"
            echo "已清理旧版本 $rel"
          done <<< "$stale"

          echo "已切换到 $SHA"
          ls -1dt releases/*/
          REMOTE

      - name: Verify deployment
        run: |
          set -euo pipefail
          LIVE="$(curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "https://$DOMAIN/version.txt")"
          echo "线上版本: $LIVE"
          echo "期望版本: $GITHUB_SHA"
          [ "$LIVE" = "$GITHUB_SHA" ] || { echo "版本不匹配" >&2; exit 1; }
          curl -fsS -o /dev/null -w 'index.html HTTP %{http_code}\n' "https://$DOMAIN/"
